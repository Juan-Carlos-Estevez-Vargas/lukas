name: E2E

# Pruebas de extremo a extremo y presupuesto de rendimiento (FIN-118).
#   1. Compila el APK de release en el runner (sin EAS ni costo), solo para x86_64 y con
#      EXPO_PUBLIC_E2E=1, que cambia la entrada por correo por un código fijo sin red.
#   2. Lo instala en un emulador de Android con KVM, corre los flujos de apps/mobile/.maestro y
#      mide el arranque en frío y el tamaño del APK (apps/mobile/e2e/perf.ts).
# Falla si un flujo falla, si el arranque (mediana) pasa de 1,5 s o si el APK pasa del límite.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/domain/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/domain/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.12.1
  MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
  API_LEVEL: 35

jobs:
  android:
    name: Maestro y rendimiento (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: pnpm install --frozen-lockfile

      - name: Generar proyecto Android
        working-directory: apps/mobile
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Compilar APK de e2e
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_E2E: "1"
          # Sin API en el emulador: las llamadas (TRM) fallan rápido y la app sigue sin red.
          EXPO_PUBLIC_API_URL: http://127.0.0.1:9
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Instalar Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Flujos y presupuesto en el emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash apps/mobile/e2e/run.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/e2e"

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
          retention-days: 14
          if-no-files-found: ignore
