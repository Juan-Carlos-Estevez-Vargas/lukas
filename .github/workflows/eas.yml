name: EAS

# Revisa que la app esté vinculada a su proyecto de Expo (EAS) y, a mano, compila el APK.
# El APK de cada release lo compila release.yml.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/eas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    name: Proyecto EAS
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vincular proyecto
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::notice::Falta EXPO_TOKEN"; exit 0; fi
          pnpm exec eas whoami
          id=$(CI=1 pnpm exec expo config --json | jq -r '.extra.eas.projectId // empty')
          if [ -n "$id" ]; then
            echo "Proyecto EAS vinculado: $id" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Crea el proyecto @<cuenta>/lukas si no existe. Como app.config.ts es dinámico, EAS no
          # puede escribir el id: lo imprime y hay que copiarlo a app.json (extra.eas.projectId).
          pnpm exec eas project:init --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/init.log" || true
          {
            echo "### Proyecto EAS sin vincular"
            echo '```'
            grep -iE "project|id|@" "$RUNNER_TEMP/init.log" | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
