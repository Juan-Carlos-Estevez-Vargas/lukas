name: Preview

# Cada PR obtiene su propia API en workers.dev con una rama de Neon aislada y migrada.
# Al cerrar el PR se borran el Worker y la rama. Si faltan los secretos, el workflow se salta
# sin fallar (ver /mnt/project-files/lukas/tareas-de-juan-carlos.md, sección 1).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEON_PROJECT_ID: super-rice-42769984
  PR: ${{ github.event.pull_request.number }}
  WORKER: lukas-api-pr-${{ github.event.pull_request.number }}
  BRANCH: preview/pr-${{ github.event.pull_request.number }}
  # GITHUB_SHA es el commit de merge temporal; el del PR es este.
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  preflight:
    name: Revisar secretos
    # Los PRs de forks y de Dependabot no reciben secretos.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$NEON_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Previews desactivadas: faltan CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o NEON_API_KEY."
          fi

  deploy:
    name: Desplegar preview
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.worker.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rama de Neon
        id: neon
        run: node scripts/preview/neon-branch.mjs create "$BRANCH"

      - name: Migraciones
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
        run: pnpm --filter @lukas/db db:migrate

      - name: Subdominio de workers.dev
        id: subdomain
        run: |
          res=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          sub=$(echo "$res" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            # Muestra el error de Cloudflare (sin datos sensibles) para distinguir cuenta equivocada
            # de subdominio sin registrar.
            echo "$res" | jq -c '.errors'
            echo "::error::No se pudo leer el subdominio de workers.dev. Revisa CLOUDFLARE_ACCOUNT_ID o elige el subdominio en Workers & Pages."
            exit 1
          fi
          echo "host=$WORKER.$sub.workers.dev" >> "$GITHUB_OUTPUT"

      # La web se compila apuntando a la API de esta preview y se publica como rama de Pages.
      - name: Web en Cloudflare Pages
        id: web
        env:
          EXPO_PUBLIC_API_URL: https://${{ steps.subdomain.outputs.host }}
          CI: "1"
        run: |
          out="$RUNNER_TEMP/web"
          (cd apps/mobile && pnpm exec expo export --platform web --output-dir "$out")
          cd apps/api
          # Crea el proyecto la primera vez; si ya existe, Cloudflare responde error y se sigue.
          pnpm exec wrangler pages project create lukas-web --production-branch main >/dev/null 2>&1 || true
          pnpm exec wrangler pages deploy "$out" --project-name lukas-web --branch "pr-$PR" \
            --commit-hash "$HEAD_SHA" --commit-dirty=true
          # El subdominio real puede llevar sufijo si lukas-web.pages.dev ya estaba tomado.
          sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/lukas-web" \
            | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then echo "::error::No se encontró el proyecto lukas-web en Pages"; exit 1; fi
          echo "url=https://pr-$PR.$sub" >> "$GITHUB_OUTPUT"

      # Turnstile no se activa en previews: su llave solo admite los dominios de staging y producción.
      - name: Desplegar Worker
        id: worker
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
          HOST: ${{ steps.subdomain.outputs.host }}
          WEB_URL: ${{ steps.web.outputs.url }}
        run: |
          umask 077
          secrets="$RUNNER_TEMP/preview-secrets.env"
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
          } > "$secrets"
          # Al crear un Worker nuevo, la API de Cloudflare a veces aún no lo ve en el paso siguiente
          # al upload (código 10007). Reintentar el deploy completo es idempotente y lo resuelve.
          for attempt in 1 2 3; do
            if pnpm exec wrangler deploy --env preview --name "$WORKER" \
              --var "AUTH_URL:https://$HOST" \
              --var "PASSKEY_RP_ID:${WEB_URL#https://}" \
              --var "APP_VERSION:pr-$PR-${HEAD_SHA::7}" \
              --var "CORS_ORIGINS:$WEB_URL,http://localhost:8081" \
              --secrets-file "$secrets"; then
              break
            fi
            if [ "$attempt" = 3 ]; then rm -f "$secrets"; exit 1; fi
            echo "::warning::Deploy falló (intento $attempt); reintento en 10 s"
            sleep 10
          done
          rm -f "$secrets"
          echo "url=https://$HOST" >> "$GITHUB_OUTPUT"

      - name: Prueba de humo
        env:
          URL: ${{ steps.worker.outputs.url }}
        run: |
          # Con un subdominio de workers.dev recién creado, el certificado TLS tarda unos minutos.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL/health" | jq -e '.status == "ok" and .environment == "preview"'; then exit 0; fi
            sleep 10
          done
          echo "::error::$URL/health no respondió"
          exit 1

      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.worker.outputs.url }}
          WEB_URL: ${{ steps.web.outputs.url }}
        run: |
          marker="<!-- lukas-preview -->"
          body="$marker
          ### Preview de este PR

          | | |
          | --- | --- |
          | Web | $WEB_URL |
          | API | $URL/health |
          | OpenAPI | $URL/v1/openapi.json |
          | Base de datos | rama \`$BRANCH\` de Neon, migrada |
          | Commit | \`${HEAD_SHA::7}\` |

          Para probar la app Android: \`EXPO_PUBLIC_API_URL=$URL pnpm --filter @lukas/mobile dev\`.
          Se borra al cerrar el PR."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  cleanup:
    name: Borrar preview
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Borrar Worker
        working-directory: apps/api
        run: pnpm exec wrangler delete --name "$WORKER" --force || echo "El Worker $WORKER no existía"

      - name: Borrar despliegues web
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/lukas-web/deployments"
          ids=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=25" \
            | jq -r --arg b "pr-$PR" '.result // [] | .[] | select(.deployment_trigger.metadata.branch == $b) | .id')
          for id in $ids; do
            curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$id?force=true" | jq -c '.success'
          done

      - name: Borrar rama de Neon
        run: node scripts/preview/neon-branch.mjs delete "$BRANCH"
