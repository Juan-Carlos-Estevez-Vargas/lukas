name: Release

on:
  push:
    branches: [main]
  # Lo dispara Auto-merge después de fusionar un PR de bot (FIN-409).
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Versionar y publicar releases
    runs-on: ubuntu-latest
    outputs:
      mobile_tag: ${{ steps.tags.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Si hay changesets pendientes, abre o actualiza el PR "Version Packages".
      # Al fusionar ese PR, crea los tags <paquete>@<versión> y sus GitHub Releases.
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm changeset tag
          commit: "chore(release): versionar paquetes"
          title: "chore(release): versionar paquetes"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag de la app
        id: tags
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          v=$(echo "${PUBLISHED:-[]}" | jq -r '.[] | select(.name == "@lukas/mobile") | .version')
          if [ -n "$v" ]; then echo "mobile=@lukas/mobile@$v" >> "$GITHUB_OUTPUT"; fi

  # Cada release de @lukas/mobile lleva su APK firmado adjunto.
  apk:
    name: APK del release
    needs: release
    if: needs.release.outputs.mobile_tag != ''
    uses: ./.github/workflows/eas.yml
    with:
      release_tag: ${{ needs.release.outputs.mobile_tag }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
