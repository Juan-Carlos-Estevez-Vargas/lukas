name: Seguridad

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Lunes 06:00 hora Colombia: detecta vulnerabilidades nuevas aunque no haya cambios.
    - cron: "0 11 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (análisis estático)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Semgrep CE
        run: >
          semgrep scan
          --config p/default
          --config p/typescript
          --config p/secrets
          --config p/github-actions
          --error
          --metrics off

  gitleaks:
    name: gitleaks (secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # En PRs revisa solo los commits nuevos; en main y en el cron, todo el historial.
      - name: Buscar secretos
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE=""
          fi
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1 $RANGE

  osv:
    name: OSV-Scanner (dependencias vulnerables)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Escanear pnpm-lock.yaml
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0 \
            scan source --lockfile /src/pnpm-lock.yaml
