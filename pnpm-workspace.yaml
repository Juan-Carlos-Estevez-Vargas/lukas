packages:
  - "apps/*"
  - "packages/*"

# Protección de la cadena de suministro
# Solo instala versiones con al menos 14 días de publicadas.
minimumReleaseAge: 20160
# Rechaza actualizaciones que pierdan la procedencia verificada de versiones anteriores.
trustPolicy: no-downgrade
# Las dependencias transitivas solo pueden venir del registro, no de git ni URLs.
blockExoticSubdeps: true

# drizzle-kit arrastra @esbuild-kit/core-utils con esbuild 0.18 (GHSA-67mh-4wv8-2f99).
# Solo se usa en desarrollo para generar migraciones; se fuerza una versión corregida.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
