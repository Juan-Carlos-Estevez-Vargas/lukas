packages:
  - "apps/*"
  - "packages/*"

# Protección de la cadena de suministro
# Solo instala versiones con al menos 14 días de publicadas.
minimumReleaseAge: 20160
# Rechaza actualizaciones que pierdan la procedencia verificada de versiones anteriores.
trustPolicy: no-downgrade
# Excepción aprobada por el dueño el 19 de noviembre de 2026, solo para esta versión exacta:
# react-native-web → fbjs trae ua-parser-js@1.0.41, publicada sin la procedencia que sí tenía
# una versión anterior. Revisar al actualizar react-native-web y quitarla si deja de hacer falta.
trustPolicyExclude:
  - ua-parser-js@1.0.41
# Las dependencias transitivas solo pueden venir del registro, no de git ni URLs.
blockExoticSubdeps: true

# drizzle-kit arrastra @esbuild-kit/core-utils con esbuild 0.18 (GHSA-67mh-4wv8-2f99).
# Solo se usa en desarrollo para generar migraciones; se fuerza una versión corregida.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # wrangler arrastra miniflare con undici 7.29.1 (8 avisos de OSV); 7.30.1 los corrige.
  "miniflare>undici": 7.30.1
  # Las herramientas de Expo (@expo/cli y @expo/fingerprint, solo de compilación) traen glob 13.0.6
  # y minimatch 10.2.6 (GHSA-3g3m-2fjr-6pw4 y GHSA-g3hv-75wg-m249). Quitar cuando Expo los actualice.
  "@expo/cli>glob": 14.0.2
  "@expo/fingerprint>glob": 14.0.2
  "@expo/fingerprint>minimatch": 11.0.1
